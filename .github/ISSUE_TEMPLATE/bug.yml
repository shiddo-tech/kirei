name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Kirei version
      description: Shown in Settings.
      placeholder: "1.2.0 (202611241200)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press ⌥⇧1
        2. Select an area
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash reports
      description: If the app crashed or froze, attach the files from ~/Library/Logs/Kirei. Before attaching screenshots, make sure they don't reveal any personal data.
