[package]
name = "kirei"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "kirei"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "gif", "tiff", "webp", "bmp"] }
smallvec = "1"
tray-icon = "0.21"
arboard = { version = "3", default-features = false, features = ["image-data"] }
resvg = "0.45"
tiny-skia = "0.11"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rayon = "1"
regex = "1"
fontdb = "0.23"
ttf-parser = "0.25"
rustybuzz = "0.20"
libc = "0.2"
unicode-segmentation = "1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "12", features = ["macos_15_0"] }
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSLocale", "NSArray", "NSString", "NSGeometry", "NSRange"] }

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
